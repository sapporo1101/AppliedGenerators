plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.89'
}

def gitTagProvider = providers.exec {
    commandLine 'git', 'describe', '--tags', '--abbrev=0'
}.standardOutput.asText.map { it.trim() }

def mod_version = gitTagProvider.get().replaceFirst('^v', '')
version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url "https://cursemaven.com" }
    maven { url 'https://modmaven.dev/' }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    mavenCentral()
}

base {
    archivesName = mod_file_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:19.2.11"
    implementation "org.appliedenergistics:guideme:21.1.9"
    implementation "curse.maven:glodium-957920:5821676"
    implementation "curse.maven:applied-flux-965012:6537909"
    implementation "curse.maven:ex-pattern-provider-892005:6593839"
    implementation "curse.maven:geckolib-388172:6304958"
    implementation "curse.maven:advancedae-1084104:6225993"
    implementation "mekanism:Mekanism:1.21.1-10.7.14.79"
    implementation "maven.modrinth:jade:15.10.0+neoforge"
    compileOnly "dev.emi:emi-neoforge:1.1.22+1.21.1:api"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.22.1.316"

    switch (use_Xei) {
        case "emi":
            runtimeOnly "curse.maven:emi-580555:5704405"
            break
        case "rei":
            runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799"
            runtimeOnly "dev.architectury:architectury-neoforge:13.0.6"
            runtimeOnly "curse.maven:cloth-config-348521:5424576"
            break
        case "jei":
            runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.22.1.316"
            runtimeOnly "dev.architectury:architectury-neoforge:13.0.6"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_issue_url          : mod_issue_url,
                             mod_display_url        : mod_display_url,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             ae2_version_range      : ae2_version_range,
                             appflux_version_range  : appflux_version_range,
                             glodium_version_range  : glodium_version_range,

    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
